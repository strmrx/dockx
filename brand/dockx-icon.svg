<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DockX">
  <defs>
    <linearGradient id="dxg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.55" stop-color="#ff7828"/>
      <stop offset="1" stop-color="#ff3d2e"/>
    </linearGradient>
    <linearGradient id="dxglow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- dark rounded-square base, so the mark carries its own background on any surface -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#0b0b0f"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="url(#dxglow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ff7828" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- the DockX layout: one full-height column beside stacked panels -->
  <rect x="13" y="13" width="12" height="38" rx="3.5" fill="url(#dxg)"/>
  <rect x="28.5" y="13" width="22.5" height="10.5" rx="3" fill="url(#dxg)"/>
  <rect x="28.5" y="26.75" width="22.5" height="10.5" rx="3" fill="url(#dxg)"/>
  <rect x="28.5" y="40.5" width="22.5" height="10.5" rx="3" fill="url(#dxg)"/>
</svg>
